openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: try-on
    description: Virtual hair try-on preview operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /try-on:
    post:
      operationId: generateTryOn
      tags: [try-on]
      summary: Generate a hairstyle try-on preview
      description: Returns a simulated preview or a provider-backed preview when configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TryOnInput"
      responses:
        "200":
          description: Generated preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryOnResult"
        "400":
          description: Invalid try-on request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TryOnInput:
      type: object
      properties:
        imageData:
          type: string
          minLength: 1
        style:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
      required:
        - imageData
        - style
        - color
    TryOnResult:
      type: object
      properties:
        previewImage:
          type: string
        mode:
          type: string
          enum: [simulation, provider]
        message:
          type: string
      required:
        - previewImage
        - mode
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

